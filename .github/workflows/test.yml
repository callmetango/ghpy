name: Test

on:
  push:

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.python.outputs.python }}

    steps:
      - name: Clone repository
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE" \
              --branch "$GITHUB_REF_NAME" --depth 1 --single-branch

      - name: Read Python versions
        id: python
        run: |
          versions=$(python .github/scripts/python-versions.py)
          echo "python=$versions" >> "$GITHUB_OUTPUT"

  test:
    needs: versions
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.versions.outputs.python) }}

    steps:
      - name: Clone repository
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE" \
              --branch "$GITHUB_REF_NAME" --depth 1 --single-branch

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          python -m pip install ".[test]"
          python -m pytest
